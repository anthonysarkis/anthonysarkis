[project]
name = "anthonysarkis"
version = "0.1.0"
description = "Draws the farm on my GitHub profile from my commits."
requires-python = ">=3.15.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PIE", "PERF", "N", "PL"]
ignore = ["PLR2004", "PLR0911", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
